{% if filtro_form or campos_disponibles %}
  <div class="card mb-3">
    <div class="card-body">
      <form method="get" class="row g-3 align-items-end">
        {% if filtro_form %}
          {% for field in filtro_form %}
            <div class="col-md-3 col-sm-6">
              <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
              {{ field }}
            </div>
          {% endfor %}
        {% endif %}

        {% if campos_disponibles %}
          <div class="col-12">
            <details>
              <summary class="fw-semibold" style="cursor:pointer;">Columnas visibles</summary>
              <div class="row g-2 mt-2">
                {% for ruta, titulo in campos_disponibles %}
                  <div class="col-md-3 col-sm-6">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        name="campos"
                        value="{{ ruta }}"
                        id="campo_{{ forloop.counter }}"
                        {% if ruta in campos_seleccionados %}checked{% endif %}
                      >
                      <label class="form-check-label" for="campo_{{ forloop.counter }}">
                        {{ titulo }}
                      </label>
                    </div>
                  </div>
                {% endfor %}
              </div>
            </details>
          </div>
        {% endif %}

        <div class="col-12 d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary">Filtrar</button>
          <a href="{{ request.path }}" class="btn btn-outline-secondary">Limpiar</a>
          <a
            href="?{% if consulta %}{{ consulta }}&{% endif %}exportar=excel"
            class="btn btn-success"
          >
            Excel
          </a>
          <a
            href="?{% if consulta %}{{ consulta }}&{% endif %}exportar=pdf"
            target="_blank"
            class="btn btn-danger"
          >
            PDF
          </a>
        </div>
      </form>
    </div>
  </div>
{% endif %}
