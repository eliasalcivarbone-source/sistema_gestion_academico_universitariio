<!DOCTYPE html>
<html lang="es-ec">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rechazar Matrícula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-danger">
                    <div class="card-header bg-danger text-white fw-semibold">
                        Confirmar rechazo / eliminación de matrícula
                    </div>
                    <div class="card-body">
                        <p class="mb-3">
                            ¿Estás seguro de que deseas rechazar la matrícula de
                            <strong>{{ object.estudiante.nombre_completo }}</strong> en
                            <strong>{{ object.seccion }}</strong>?
                        </p>
                        <form method="post" class="d-flex gap-2">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">Sí, rechazar matrícula</button>
                            <a href="{% url 'academico:matriculas' %}" class="btn btn-outline-secondary">Cancelar</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
