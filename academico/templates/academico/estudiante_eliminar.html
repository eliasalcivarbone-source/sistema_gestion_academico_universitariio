{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Eliminar Estudiante</h4>
        </div>
        <div class="card-body">
            <p>¿Estás seguro de que quieres eliminar al estudiante <strong>{{ estudiante.nombres }} {{ estudiante.apellidos }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{% url 'academico:estudiante_lista' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
