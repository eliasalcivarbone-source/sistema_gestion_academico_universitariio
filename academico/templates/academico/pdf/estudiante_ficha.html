<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ficha de Estudiante</title>
    <style>
        body { font-family: sans-serif; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>Ficha del Estudiante</h1>
    <p><strong>Nombre:</strong> {{ estudiante.apellidos }} {{ estudiante.nombres }}</p>
    <p><strong>Cédula:</strong> {{ estudiante.cedula }}</p>
    <p><strong>Carrera:</strong> {{ estudiante.carrera.nombre }}</p>
    <p><strong>Email:</strong> {{ estudiante.email }}</p>
</body>
</html>
